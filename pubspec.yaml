# Dart pub workspace (#60): one lockfile for every Dart package in the monorepo.
#   packages/notelore_core  pure Dart core shared by every app (format, store, sync, providers, agent)
#   apps/notelore           the Flutter app: Android, iOS, Windows, macOS
name: notelore_workspace
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: 3.47.6  # the one place the Flutter version is pinned; CI reads it from here

workspace:
  - packages/notelore_core
  - apps/notelore

dev_dependencies:
  test: ^1.26.0

# The on-device model (#328): llamadart bundles only llama.cpp (no LiteRT-LM),
# on the CPU (no Vulkan: 26 MB per ABI for a feature most never download a
# model for). Android keeps its full set of CPU variants for prefill speed.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_backends:
        platforms:
          android: [cpu]
          windows: [cpu]
