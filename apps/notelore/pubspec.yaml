name: notelore
description: "Notelore: talk to your notes on Android, iOS, Windows and macOS."
publish_to: 'none'
version: 0.3.0
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  notelore_core:
    path: ../../packages/notelore_core
  path: ^1.9.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  google_sign_in_platform_interface: ^3.1.0
  lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
