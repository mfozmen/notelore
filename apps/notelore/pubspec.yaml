name: notelore
description: "Notelore: talk to your notes on Android, iOS, Windows and macOS."
publish_to: 'none'
version: 0.24.0
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  google_sign_in: ^7.2.0
  http: ^1.6.0
  llamadart: 0.14.0
  local_auth: 3.0.2
  markdown: ^7.3.1
  notelore_core:
    path: ../../packages/notelore_core
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdfrx: ^2.6.5
  record: ^7.1.2
  share_plus: ^13.3.1
  sherpa_onnx: ^1.13.8
  speech_to_text: ^7.5.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  file_selector_platform_interface: ^2.7.0
  flutter_test:
    sdk: flutter
  google_sign_in_platform_interface: ^3.1.0
  lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  share_plus_platform_interface: ^7.2.0
  speech_to_text_platform_interface: ^2.5.0
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    # Noto Sans (SIL Open Font License, OFL.txt): PDF exports need every Turkish
    # letter, which the PDF standard fonts lack.
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    # Google's G for the Sign in with Google button (assets/google/README.md).
    - assets/google/g_light.png
    - assets/google/g_dark.png
