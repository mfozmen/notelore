sonar.projectKey=mfozmen_notelore
sonar.organization=mfozmen
sonar.sources=packages/notelore_core/lib,apps/notelore/lib,apps/catalog/lib
sonar.tests=packages/notelore_core/test,apps/notelore/test,apps/catalog/test
sonar.dart.lcov.reportPaths=packages/notelore_core/coverage/lcov.info,apps/notelore/coverage/lcov.info
# The English and Turkish string tables, and the light and dark colour schemes,
# mirror each other line for line by design.
sonar.cpd.exclusions=apps/notelore/lib/src/strings.dart,apps/notelore/lib/src/schemes.dart
# Native FFI glue that `flutter test` cannot load; the coverage gate skips it the same way.
# The design catalog only shows widgets apps/notelore covers, so it is outside the gate too.
sonar.coverage.exclusions=apps/catalog/**,apps/notelore/lib/src/whisper_native.dart,apps/notelore/lib/src/share_native.dart,apps/notelore/lib/src/pdf_native.dart,apps/notelore/lib/src/awake_native.dart,apps/notelore/lib/src/audio_native.dart,apps/notelore/lib/src/reminder_native.dart,apps/notelore/lib/src/network_native.dart
