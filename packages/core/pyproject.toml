[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notelore-core"
# The release workflow bumps the version in src/notelore/__init__.py, in step with the apps.
dynamic = ["version"]
description = "Notelore's shared core: note format, store, index, sync, LLM providers and the agent."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mehmet Fahri Özmen" }]
# The base install must work on Android and iOS too (#48): pure Python or with
# mobile wheels only. Desktop-only packages live in the "desktop" extra and are
# imported lazily (tests/test_layout.py enforces both rules). The LLM providers
# speak plain HTTPS instead of the vendor SDKs, whose pydantic-core and jiter
# have no mobile wheels (#51).
dependencies = [
  "certifi>=2024.2.2",          # CA bundle for the providers' HTTPS (mobile has no usable store)
  "platformdirs>=4.2",          # per-OS state/config dirs (Android-aware)
  "pyyaml>=6.0",                # note front matter
]

[project.optional-dependencies]
desktop = [
  "keyring>=25.0",              # API keys + OAuth tokens in the OS credential store
  # Google Drive sync
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.2",
]

[tool.hatch.version]
path = "src/notelore/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/notelore"]
