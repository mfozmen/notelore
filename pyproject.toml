[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notelore"
version = "0.1.0"
description = "Talk to an LLM, get tidy human-readable Markdown notes on your disk, ask them questions later. Backed up to Google Drive."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mehmet Fahri Özmen" }]
keywords = ["notes", "llm", "cli", "markdown", "memory"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "platformdirs>=4.2",          # per-OS state/config dirs
  "pyyaml>=6.0",                # note front matter
  "rich>=13.0",                 # terminal output
  "prompt_toolkit>=3.0",        # REPL + slash-command completion
  "keyring>=25.0",              # API keys + OAuth tokens in the OS credential store
  # LLM providers (bundled, same reasoning as littlepress-ai)
  "anthropic>=0.40",
  "openai>=1.50",
  "google-genai>=1.0",
  "ollama>=0.4",
  # Google Drive sync
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.2",
]

[project.scripts]
notelore = "notelore.cli:main"

[project.urls]
Homepage = "https://github.com/mfozmen/notelore"
Repository = "https://github.com/mfozmen/notelore"
Issues = "https://github.com/mfozmen/notelore/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-socket>=0.7",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notelore"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Turkish letters are legitimate in i18n.py and fixtures, not typos of ASCII look-alikes.
allowed-confusables = ["ı", "İ"]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "PTH",           # pathlib only — keeps paths cross-platform
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.oauth2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# Network is off for the whole suite; live tests are opt-in via `-m live`.
addopts = "--strict-markers --disable-socket -m 'not live'"
markers = [
  "live: hits a real LLM provider or Google Drive; needs keys in env vars",
]

[tool.coverage.run]
source = ["notelore"]
branch = true
