# Monorepo root: a uv workspace, not a package. Shared tool settings live here.
#   packages/core  notelore-core  (import: notelore)       shared by every app
#   apps/cli       notelore       (import: notelore_cli)   desktop command + REPL
[project]
name = "notelore-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = ["notelore", "notelore-core"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/cli"]

[tool.uv.sources]
notelore = { workspace = true }
notelore-core = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-socket>=0.7",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pre-commit>=3.8",
  "pyinstaller>=6.22.3",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/core/src", "apps/cli/src", "tests"]

[tool.ruff.lint]
# Turkish letters are legitimate in i18n.py and fixtures, not typos of ASCII look-alikes.
allowed-confusables = ["ı", "İ"]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "PTH",           # pathlib only — keeps paths cross-platform
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages/core/src", "apps/cli/src", "tests"]
mypy_path = ["packages/core/src", "apps/cli/src"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.oauth2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# Network is off for the whole suite; live tests are opt-in via `-m live`.
# Coverage is measured on every run and must stay at 100% (line and branch);
# SonarCloud reads the same numbers from coverage.xml in CI.
addopts = "--strict-markers --disable-socket -m 'not live' --cov --cov-report=term-missing:skip-covered"
markers = [
  "live: hits a real LLM provider or Google Drive; needs keys in env vars",
]

[tool.coverage.run]
source = ["notelore", "notelore_cli"]
branch = true

[tool.coverage.report]
fail_under = 100

# ---------------------------------------------------------------- semantic release
[tool.semantic_release]
# Conventional Commits drive every version bump: feat -> minor, fix/perf ->
# patch, BREAKING CHANGE -> major. Never edit the version by hand.
version_variables = [
  "packages/core/src/notelore/__init__.py:__version__",
  "apps/cli/src/notelore_cli/__init__.py:__version__",
]
commit_message = "chore(release): {version} [skip ci]"
changelog_file = "CHANGELOG.md"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
