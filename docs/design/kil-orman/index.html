<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notelore: Kil and Orman</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Fraunces:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c0c0e;color:#e8e6e1;font:15px/1.5 Inter,system-ui,sans-serif}
main{max-width:1240px;margin:0 auto;padding:40px 20px 120px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.lead{color:#9b978e;max-width:760px;margin:8px 0 40px}
.dir{margin:0 0 72px}
.dir h2{font-size:22px;font-weight:700;display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.dir p.why{color:#9b978e;max-width:820px;margin-bottom:20px}
.cap{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#77736b;text-transform:uppercase;margin:0 0 10px 4px}

/* phone frame */
.ph{width:360px;height:760px;border-radius:36px;overflow:hidden;position:relative;flex:none;border:1px solid #2a2a2e;display:flex;flex-direction:column}
.sb{height:28px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font:600 12px Inter;opacity:.8}
.body{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;min-height:0}
.body>*,.lp>*,.col>*,.nv>*{flex-shrink:0}
.nav{height:64px;flex:none;display:flex;justify-content:space-around;align-items:center}
.nav span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:18px;height:18px}
svg.f{fill:currentColor}

/* ===== Kor: Kil (light) and Orman (dark) ===== */
.t7{--bg:#f6efe6;--sf:#fffaf4;--bd:#eadccb;--tx:#2b1a12;--mu:#8a6a58;--ac:#c2410c;--ac2:#ea580c;
  --meBg:#fbe6d4;--meBd:#efc4a2;--meTx:#4a2312;--sh:0 4px 14px #c2410c12;--late:#B42318;--scrim:#2b1a1255;
  background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',Inter,sans-serif}
.t7.dk{--bg:#0c120e;--sf:#131b16;--bd:#223026;--tx:#e9efe9;--mu:#8fa093;--ac:#d9884f;--ac2:#eba26f;--meBg:#18231c;--meBd:#d9884f55;--meTx:#f6e3d2;--sh:none;--late:#E8806B;--scrim:#000a;
  background:radial-gradient(ellipse 120% 50% at 50% 0%,#1d3a2a 0%,transparent 65%),#0c120e}
.t7.dk .orb{background:radial-gradient(circle at 35% 30%,#fff1e6,var(--ac) 55%,color-mix(in srgb,var(--ac) 45%,#000));color:#fff}
.t7.dk .dot{box-shadow:0 0 8px var(--ac)}
.t7 .lbl{font:500 10.5px 'JetBrains Mono',monospace;letter-spacing:.16em;color:var(--ac);text-transform:uppercase}
.t7 .mu{color:var(--mu)}
.t7 .sync{font:500 10px 'JetBrains Mono',monospace;color:var(--mu);display:flex;align-items:center;gap:8px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.t7 .dot{width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac);flex:none}
.t7 .ttl{font:600 30px/1.08 Fraunces,serif;letter-spacing:-.02em}

/* app bar */
.t7 .ab{height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px}
.t7 .ab .at{flex:1;min-width:0;padding-left:4px}
.t7 .ab .at b{display:block;font:600 22px/1.15 Fraunces,serif;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t7 .ab .at .sync{margin-top:4px}
.t7 .ab .brand{font:500 12px 'JetBrains Mono',monospace;letter-spacing:.16em;color:var(--ac);text-transform:uppercase}
.t7 .ib{width:40px;height:40px;display:grid;place-items:center;color:var(--tx);border-radius:50%;flex:none}
.t7 .ib.m{color:var(--mu)}
.t7 .ib.on{color:var(--ac)}
.t7 .acts{display:flex;align-items:center}

/* chat */
.t7 .msgs{flex:1;padding:8px 16px;display:flex;flex-direction:column;gap:4px;justify-content:flex-end;min-height:0}
.t7 .me{align-self:flex-end;max-width:78%;background:var(--meBg);border:1px solid var(--meBd);color:var(--meTx);padding:10px 14px;border-radius:20px 20px 6px 20px;font-size:15px;line-height:1.5}
.t7 .ai{max-width:94%;font-size:15px;line-height:1.55;padding-top:4px}
.t7 .ai p+p,.t7 .ai p+ul{margin-top:8px}
.t7 .ai ul{padding-left:20px}
.t7 .ai li{margin:2px 0}
.t7 .ai b{font-weight:700}
.t7 .ma{display:flex;gap:0;margin:-4px 0 4px -8px;color:var(--mu)}
.t7 .ma.end{align-self:flex-end;margin:0 -8px 4px 0}
.t7 .ma .ib{width:36px;height:36px;color:var(--mu)}
.t7 .mchip{display:inline-flex;align-items:center;gap:6px;font:500 12px 'Plus Jakarta Sans';color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:4px 8px 4px 10px;margin:4px 16px 0;align-self:flex-start;background:var(--sf)}
.t7 .mchip svg{color:var(--ac)}
.t7 .cmp{margin:8px 16px 16px;display:flex;align-items:center;gap:4px;background:var(--sf);border:1px solid var(--bd);border-radius:28px;padding:4px 4px 4px 4px;box-shadow:var(--sh)}
.t7 .cmp .ph1{flex:1;color:var(--mu);font-size:15px;padding-left:4px}
.t7 .orb{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fed7aa,var(--ac2) 55%,#7c2d12);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 45%,transparent);flex:none}
.t7 .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:24px 24px 16px;text-align:center}
.t7 .empty .eic{color:var(--ac);margin-bottom:16px}
.t7 .empty .eic svg{width:56px;height:56px;stroke-width:1.3}
.t7 .empty .et{font:500 17px/1.4 'Plus Jakarta Sans';max-width:300px;margin-bottom:24px}
.t7 .starter{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--bd);border-radius:16px;background:var(--sf);padding:12px 16px;font-size:14px;margin-bottom:8px;color:var(--tx);box-shadow:var(--sh)}
.t7 .starter svg{color:var(--ac)}

/* banner */
.t7 .ban{flex:none;border-bottom:1px solid var(--bd);background:var(--sf);padding:16px 16px 8px}
.t7 .ban .bt{display:flex;gap:16px;align-items:flex-start;font-size:14px;line-height:1.45}
.t7 .ban .bt svg{color:var(--ac);margin-top:2px}
.t7 .ban .ba{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.t7 .btn{border:1px solid var(--bd);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--ac);background:var(--sf);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.t7 .btn.fill{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.t7 .btn.txt{border-color:transparent;background:transparent}

/* nav */
.t7 .nav{border-top:1px solid var(--bd);color:var(--mu)}
.t7 .nav .on{color:var(--ac)}

/* sections and cards */
.t7 .sec{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}
.t7 .sec i{flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
.t7 .srch{margin:8px 16px 4px;height:48px;border:1px solid var(--bd);border-radius:999px;background:var(--sf);display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--mu);font-size:14.5px;flex:none}
.t7 .card{margin:0 16px 8px;border:1px solid var(--bd);border-radius:18px;padding:12px 16px 12px 12px;background:var(--sf);box-shadow:var(--sh);display:flex;gap:12px}
.t7 .card.selc{border-color:var(--ac)}
.t7 .av{width:32px;height:32px;border-radius:50%;background:var(--meBg);color:var(--ac);display:grid;place-items:center;flex:none;margin-top:2px}
.t7 .cb2{flex:1;min-width:0}
.t7 .card h4{font:600 16px/1.25 Fraunces,serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t7 .card p{font-size:13px;line-height:1.4;color:var(--mu);margin:4px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t7 .meta{font:500 10px 'JetBrains Mono',monospace;color:var(--mu);letter-spacing:.06em;display:flex;gap:8px;white-space:nowrap;overflow:hidden;text-transform:uppercase}
.t7 .meta .tags{overflow:hidden;text-overflow:ellipsis;min-width:0;text-transform:none}
.t7 .meta b{color:var(--ac);font-weight:500;margin-left:auto;flex:none;padding-left:8px}
.t7 .up{margin:8px 16px 4px;border:1px solid var(--bd);border-radius:20px;padding:12px 16px 4px;background:var(--sf);box-shadow:var(--sh)}
.t7 .uph{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.t7 .upr{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.t7 .uph+.upr{border-top:0}
.t7 .ud{width:40px;flex:none;text-align:center;line-height:1}
.t7 .ud b{display:block;font:600 20px Fraunces,serif;color:var(--ac)}
.t7 .ud span{font:500 9px 'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
.t7 .ut{min-width:0;flex:1}
.t7 .ut div{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t7 .ut span{font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.t7 .mono{font:500 10px 'JetBrains Mono',monospace;letter-spacing:.06em;color:var(--mu);text-transform:uppercase}

/* note page */
.t7 .nv{padding:8px 16px 24px}
.t7 .nv h1{font:600 28px/1.12 Fraunces,serif;letter-spacing:-.02em;font-weight:600}
.t7 .nhm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--mu)}
.t7 .kchip{background:var(--meBg);color:var(--meTx);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600}
.t7 .nv .sec{padding:24px 0 8px}
.t7 .dec{border:1px solid var(--bd);border-radius:18px;background:var(--sf);padding:12px 16px;margin-bottom:8px;box-shadow:var(--sh)}
.t7 .dec .dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t7 .dec .dv{font:600 20px/1.25 Fraunces,serif;margin-top:4px}
.t7 .dec .dr{font-size:13.5px;color:var(--mu);margin-top:4px}
.t7 .earl{display:flex;align-items:center;justify-content:space-between;height:48px;font-size:14px;color:var(--tx)}
.t7 .earl svg{color:var(--mu)}
.t7 .rrow{display:flex;gap:12px;align-items:flex-start;padding:6px 0;font-size:14px}
.t7 .rrow svg{color:var(--ac)}
.t7 .rrow .rt{flex:1;min-width:0}
.t7 .rrow .rw{font-size:12px;color:var(--mu);white-space:nowrap;padding-top:2px}
.t7 .rrow .rw.late{color:var(--late)}
.t7 .rrow.done .rt{color:var(--mu);text-decoration:line-through}
.t7 .cb{width:18px;height:18px;border-radius:4px;border:2px solid var(--ac);flex:none;display:grid;place-items:center;margin-top:1px}
.t7 .cb.on{background:var(--mu);border-color:var(--mu);color:var(--bg)}
.t7 .cb.on svg{width:14px;height:14px;stroke-width:2.6}
.t7 .cb.late{border-color:var(--late)}
.t7 .tl{display:flex;gap:0;font-size:14px}
.t7 .tl .td{width:64px;flex:none;padding-top:2px}
.t7 .tl .tb{border-left:2px solid var(--bd);padding:0 0 16px 16px;flex:1;min-width:0}
.t7 .tl .tb div+div{margin-top:4px}
.t7 .tl:last-child .tb{padding-bottom:0}

/* calendar */
.t7 .mon{display:flex;align-items:center;padding:0 12px;height:48px;flex:none}
.t7 .mon .m{flex:1;text-align:center;font:600 19px Fraunces,serif;white-space:nowrap}
.t7 .mon .td{font:500 10px 'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--ac);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;background:var(--sf);text-transform:uppercase}
.t7 .cal{margin:0 16px 8px;border:1px solid var(--bd);border-radius:20px;background:var(--sf);padding:8px 8px 4px;box-shadow:var(--sh)}
.t7 .grid7{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.t7 .wd{font:500 9.5px 'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--mu);padding:4px 0 4px;text-transform:uppercase}
.t7 .dd{height:40px;display:flex;align-items:center;justify-content:center;font-size:13.5px;position:relative}
.t7 .dd .n{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;padding-bottom:2px}
.t7 .dd.today .n{border:1.5px solid var(--ac);font-weight:700}
.t7 .dd.sel .n{background:var(--ac);color:var(--bg);font-weight:700}
.t7 .dd i{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--ac)}
.t7 .dd i.late{background:var(--late)}
.t7.dsk .cal .dd{height:48px}
.t7.dsk .cal .dd .n{width:44px;height:44px}
.t7.dsk .cal .dd i{bottom:6px}
.t7 .ag{margin:0 16px 8px;border:1px solid var(--bd);border-radius:18px;background:var(--sf);box-shadow:var(--sh);overflow:hidden}
.t7 .agr{display:flex;gap:16px;align-items:center;padding:8px 16px;min-height:56px;border-top:1px solid var(--bd)}
.t7 .agr:first-child{border-top:0}
.t7 .agr .tx{flex:1;min-width:0}
.t7 .agr .tx div{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t7 .agr .tx span{font-size:12px;color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t7 .agr .cb{margin:0}
.t7 .lbl.late{color:var(--late)}
.t7 .alarm{color:var(--ac);display:grid}

/* about me */
.t7 .fact{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 16px;border-top:1px solid var(--bd);font-size:14.5px;min-height:48px}
.t7 .fact:first-child{border-top:0}
.t7 .fact span.t{flex:1}
.t7 .del{width:40px;height:40px;display:grid;place-items:center;color:var(--mu);flex:none}
.t7 .priv{margin:16px 16px 8px;border:1px solid var(--bd);border-radius:18px;background:var(--sf);padding:12px 8px 12px 16px;display:flex;gap:16px;align-items:center;box-shadow:var(--sh)}
.t7 .priv .tx{flex:1}
.t7 .priv b{font:600 15px Fraunces,serif;display:block}
.t7 .priv span{font-size:12.5px;color:var(--mu)}
.t7 .ico{color:var(--ac);display:grid}
.t7 .fab{position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:8px;height:56px;padding:0 20px 0 16px;border-radius:18px;background:var(--ac);color:var(--bg);font-weight:600;font-size:14px;box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 40%,transparent)}

/* drawer and settings */
.t7 .scrim{position:absolute;inset:0;background:var(--scrim)}
.t7 .drawer{position:absolute;left:0;top:0;bottom:0;width:304px;background:var(--bg);border-right:1px solid var(--bd);border-radius:0 24px 24px 0;padding:48px 12px 8px;display:flex;flex-direction:column}
.t7.dk .drawer{background:#0f1712}
.t7 .mark{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fed7aa,var(--ac2) 55%,#7c2d12);flex:none}
.t7 .dbr{display:flex;align-items:center;gap:16px;padding:8px 16px 16px;font:600 22px Fraunces,serif}
.t7 .dlab{padding:8px 16px 4px}
.t7 .cats .it,.t7 .drawer .it{display:flex;align-items:center;gap:16px;height:48px;padding:0 16px;border-radius:14px;font-size:14.5px;color:var(--tx)}
.t7 .cats .it svg,.t7 .drawer .it svg{color:var(--mu)}
.t7 .cats .it.on{color:var(--ac);background:var(--sf);border:1px solid var(--bd);font-weight:600}
.t7 .cats .it.on svg{color:var(--ac)}
.t7 .scard{border:1px solid var(--bd);border-radius:18px;background:var(--sf);box-shadow:var(--sh);margin:0 0 8px;padding:8px 0}
.t7 .srow{display:flex;gap:16px;align-items:center;padding:8px 16px}
.t7 .srow > svg{color:var(--mu)}
.t7 .srow .tx{flex:1;min-width:0}
.t7 .srow b{font-weight:600;font-size:14.5px;display:block}
.t7 .srow span.sub2{font-size:12.5px;color:var(--mu);display:block}
.t7 .pick{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--bd);border-radius:12px;padding:8px 8px 8px 12px;font-size:13.5px;white-space:nowrap}
.t7 .chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 8px}
.t7 .chipc{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:10px;padding:6px 12px;font-size:13.5px;color:var(--tx)}
.t7 .chipc.on{background:var(--meBg);border-color:var(--meBd);color:var(--meTx);font-weight:600}
.t7 .zoom{display:flex;align-items:center;gap:4px;padding:0 16px 8px 8px}
.t7 .zoom .pc{width:64px;text-align:center;font-size:14px}

/* desktop */
.dk-frame{width:1280px;height:800px;border-radius:14px;overflow:hidden;border:1px solid #2a2a2e;display:flex;zoom:.9}
.t7.dsk{flex-direction:row}
.t7 .rail{width:232px;flex:none;border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px}
.t7 .rail .brand{padding:8px 16px 24px}
.t7 .rail .it{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:14px;color:var(--mu);font-size:14px;font-weight:500}
.t7 .rail .it.on{color:var(--ac);background:var(--sf);border:1px solid var(--bd);font-weight:600}
.t7 .rail .sp{flex:1}
.t7 .rail .foot{padding:12px 16px}
.t7 .pane{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.t7 .dab{height:64px;flex:none;display:flex;align-items:center;padding:0 24px}
.t7 .dab b{font:600 26px Fraunces,serif;letter-spacing:-.01em}
.t7 .split{display:flex;flex:1;min-height:0}
.t7 .lp{width:400px;flex:none;border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.t7 .lh{display:flex;justify-content:flex-end;padding:0 8px 0 16px;height:48px;align-items:center;flex:none}
.t7 .rp{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;min-width:0}
.t7 .col{max-width:760px;width:100%}
.t7 .rbar{display:flex;justify-content:flex-end;padding:8px 8px 0 0;width:100%}
.t7 .wide{flex:1;display:flex;flex-direction:column;padding:0 24px;min-height:0}
.t7 .wide .msgs{padding:8px 0}
.t7 .wide .mchip{margin:4px 0 0}
.t7 .wide .cmp{margin:8px 0 16px}
.t7 .wide .me{max-width:62%}
.t7 .wide .ai{max-width:70ch}
.dkrow{display:flex;flex-direction:column;gap:18px;padding:8px 4px 34px}
.pairrow{display:flex;gap:28px;overflow-x:auto;padding:8px 4px 28px}

@media print{@page{size:1320px 1900px;margin:24px}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.pairrow{flex-wrap:wrap}.ph{break-inside:avoid}}
</style></head><body><main>
<h1 id="h1"></h1><p class="lead" id="lead"></p>
<section class="dir"><p class="why" id="why"></p><div id="kor"></div></section>
<section class="dir"><h2 id="h2d"></h2><div id="desk"></div></section>
</main><script>
(function(){
const P=d=>`<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const S=d=>`<svg class="i s" viewBox="0 0 24 24">${d}</svg>`;
const D={
 chat:'<path d="M4 5h16v11H8l-4 4z"/>',
 notes:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/>',
 cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
 me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',

 ${rows.map(([d,t,n])=>`<div class="upr"><div class="ud"><b>${d}</b><span>${L.months[10]}</span></div><div class="ut"><div>${t}</div><span>${n}</span></div></div>`).join('')}</div>`;
const notesList=(sel)=>`${upStrip(L.up)}${sec(L.pinned)}${card(C.atlas,sel)}${sec(L.others)}${card(C.party)}${card(C.shed)}${card(C.lisbon)}${card(C.laptop)}`;
const notes=()=>`${sb}<div class="body"><div class="ab" style="height:64px"><span class="ib">${I.menu}</span><span class="at"><b>${L.notes}</b>${syncLine}</span>${listActs}</div>
 ${search}${notesList(false)}</div>${nav(1)}`;

/* note page */
const N=L.note;
const noteView=()=>`<div class="nv"><h1>${N.title}</h1><div class="nhm"><span class="kchip">${L.kinds.project}</span><span>${N.tags}&nbsp;&nbsp;·&nbsp;&nbsp;${L.updated(N.updated)}</span></div>
 <div class="sec"><span class="lbl">✦ ${L.heads.decisions}</span><i></i></div>
 ${N.decisions.map(([t,v,r,d])=>`<div class="dec"><div class="dh"><span class="lbl">${t}</span><span class="mono">${d}</span></div><div class="dv">${v}</div><div class="dr">${r}</div></div>`).join('')}
 <div class="earl"><span>${L.earlier(1)}</span>${s.down}</div>
 <div class="sec"><span class="lbl">✦ ${L.heads.reminders}</span><i></i></div>
 ${N.reminders.map(([t,w])=>`<div class="rrow">${s.bell}<span class="rt">${t}</span><span class="rw">${w}</span></div>`).join('')}
 <div class="sec"><span class="lbl">✦ ${L.heads.todo}</span><i></i></div>
 ${N.todos.map(([t,d,late])=>`<div class="rrow">${cb(false)}<span class="rt">${t}</span><span class="rw${late?' late':''}">${late?L.overdue(d):d}</span></div>`).join('')}
 ${N.done.map(([t,d])=>`<div class="rrow done">${cb(true)}<span class="rt">${t}</span><span class="rw">${d}</span></div>`).join('')}
 <div class="sec"><span class="lbl">✦ ${L.heads.notes}</span><i></i></div>
 ${N.notes.map(([d,ts])=>`<div class="tl"><span class="td mono">${d}</span><div class="tb">${ts.map(t=>`<div>${t}</div>`).join('')}</div></div>`).join('')}
</div>`;
const noteActs=`<span class="acts"><span class="ib on">${I.pinf}</span><span class="ib">${I.share}</span><span class="ib">${I.bin}</span></span>`;
const note=()=>`${sb}<div class="body"><div class="ab"><span class="ib">${I.back}</span><span class="at"></span>${noteActs}</div>${noteView()}</div>`;

/* calendar */
const A=L.agenda;
const marks={4:'late',5:'late',7:'',8:'',9:'',12:'',14:'',18:''};
const grid=()=>{let h=L.weekdays.map(w=>`<div class="wd">${w}</div>`).join('');for(let i=0;i<6;i++)h+='<div class="dd"></div>';
 for(let d=1;d<=30;d++){const m=marks[d];h+=`<div class="dd${d==7?' today':''}"><span class="n">${d}</span>${m!==undefined?`<i class="${m}"></i>`:''}</div>`;}
 return `<div class="cal"><div class="grid7">${h}</div></div>`;};
const monRow=`<div class="mon"><span class="ib m">${I.l}</span><span class="m">${L.monthYear}</span><span class="td">${L.today}</span><span class="ib m">${I.r}</span></div>`;
const todoRow=([t,sub],late)=>`<div class="agr">${cb(false,late)}<div class="tx"><div>${t}</div><span>${sub}</span></div></div>`;
const remRow=([t,sub])=>`<div class="agr"><span class="alarm">${s.alarm}</span><div class="tx"><div>${t}</div><span>${sub}</span></div></div>`;
const agenda=(all)=>`${sec(L.overdueGroup,true)}<div class="ag">${A.late.map(r=>todoRow(r,true)).join('')}</div>
 ${sec(L.today)}<div class="ag">${remRow(A.today)}</div>
 ${sec(L.tomorrow)}<div class="ag">${remRow(A.tomorrow)}</div>
 ${sec(L.day9)}<div class="ag">${remRow(A.d9)}</div>
 ${sec(L.day12)}<div class="ag">${todoRow(A.d12)}</div>
 ${all?`${sec(L.day14)}<div class="ag">${todoRow(A.d14)}</div>${sec(L.day18)}<div class="ag">${todoRow(A.d18)}</div>`:''}`;
const calendar=()=>`${sb}<div class="body">${ab(L.calendar)}${monRow}${grid()}${agenda(true)}</div>${nav(2)}`;

/* about me */
const factsList=()=>L.facts.map((fs,i)=>`${sec(L.aboutSecs[i])}<div class="ag">${fs.map(f=>`<div class="fact"><span class="t">${f}</span><span class="del">${s.bin}</span></div>`).join('')}</div>`).join('');
const privacy=`<div class="priv"><span class="ico">${I.shield}</span><div class="tx"><b>${L.shared}</b><span>${L.sharedMeans}</span></div><span class="del">${I.r}</span></div>`;
const aboutme=()=>`${sb}<div class="body">${ab(L.aboutMe)}${factsList()}${privacy}</div>${nav(3)}`;
const aboutAdd=()=>`${sb}<div class="body">${ab(L.aboutMe)}${factsList()}${privacy}<span class="fab">${I.plus}${L.addFact}</span></div>${nav(3)}`;

/* ---------- desktop ---------- */
const rail=a=>`<div class="rail"><div class="brand"><span class="lbl">✦ Notelore</span></div>
 ${[[I.chat,L.chat],[I.notes,L.notes],[I.cal,L.calendar],[I.me,L.aboutMe],[I.gear,L.settings]].map(([ic,t],i)=>`<div class="it ${i==a?'on':''}">${ic}${t}</div>`).join('')}
 <div class="sp"></div><div class="foot">${syncLine}</div></div>`;
const dab=t=>`<div class="dab"><b>${t}</b></div>`;
const dChat=()=>`${rail(0)}<div class="pane"><div class="wide"><div class="msgs">${conv(L.conv)}</div>${chip}${composer}</div></div>`;
const dNotes=()=>`${rail(1)}<div class="pane">${dab(L.notes)}<div class="split">
 <div class="lp"><div class="lh">${listActs}</div>${search}${notesList(true)}</div>
 <div class="rp"><div class="col"><div class="rbar">${noteActs}</div>${noteView()}</div></div>
</div></div>`;
const dCal=()=>`${rail(2)}<div class="pane">${dab(L.calendar)}<div class="split">
 <div style="width:380px;flex:none;border-right:1px solid var(--bd);padding-top:8px">${monRow}${grid()}</div>
 <div style="flex:1;overflow:hidden;padding-top:0"><div class="col">${agenda(true)}</div></div></div></div>`;
const dMe=()=>`${rail(3)}<div class="pane">${dab(L.aboutMe)}<div class="rp"><div class="col">${factsList()}${privacy}</div></div></div>`;
const dSet=()=>`${rail(4)}<div class="pane">${dab(L.settings)}<div class="split">
 <div class="cats" style="width:260px;flex:none;border-right:1px solid var(--bd);padding:8px">${L.cats.map((c,i)=>`<div class="it${i==3?' on':''}">${catIconsL[i]}${c}</div>`).join('')}</div>
 <div class="rp" style="padding:8px 24px 0 16px"><div class="col">${appearanceCards()}</div></div></div></div>`;

/* ---------- render ---------- */
document.title=L.h1;
document.getElementById('h1').textContent=L.h1;
document.getElementById('lead').textContent=L.lead;
document.getElementById('why').textContent=L.why;
document.getElementById('h2d').textContent=L.desktop;
const F=L.frames;
const phones=[[F.chat,chat],[F.empty,chatEmpty],[F.banner,chatBanner],[F.menu,menu],[F.notes,notes],[F.note,note],[F.calendar,calendar],[F.aboutme,aboutme],[F.aboutAdd,aboutAdd],[F.appearance,appearance]];
document.getElementById('kor').innerHTML=phones.map(([n,f])=>`<div class="pairrow">
 <div><div class="cap">${n} · ${L.day}</div><div class="ph t7">${f()}</div></div>
 <div><div class="cap">${n} · ${L.night}</div><div class="ph t7 dk">${f()}</div></div></div>`).join('');
const dsk=[[F.chat,dChat],[F.notes,dNotes],[F.calendar,dCal],[F.aboutme,dMe],[F.dSettings,dSet]];
document.getElementById('desk').innerHTML=dsk.map(([n,f])=>`<div class="dkrow"><div><div class="cap">${n} · ${L.day}</div><div class="dk-frame t7 dsk">${f()}</div></div><div><div class="cap">${n} · ${L.night}</div><div class="dk-frame t7 dk dsk">${f()}</div></div></div>`).join('');
})();
</script></body></html>
