name: Release

# Manual only: run `gh workflow run release.yml` when the maintainer wants a
# release. Python Semantic Release then scans the Conventional Commits since
# the last tag and bumps accordingly (feat -> minor, fix/perf -> patch,
# BREAKING CHANGE -> major), writes CHANGELOG.md, tags vX.Y.Z and cuts a
# draft GitHub Release. The app jobs build the Flutter app for Windows and macOS
# and signed Android APKs (one per ABI, plus universal), and `attach` writes the .sha256 of each file the
# app's updater installs, signs it with the update key (#485) and uploads them,
# the only job besides the release with a write token,
# then publishes the release once every platform's files are up (#476): until
# then it is a draft, which no updater sees. (Assets are
# named notelore-app-*: the retired CLI's `notelore update` looked for
# notelore-<v>-*.zip and must never pick one up.) Config: releaserc.toml.
# Adapted from mfozmen/littlepress-ai.
#
# PSR's own "chore(release): x.y.z [skip ci]" commit is pushed with
# GITHUB_TOKEN, which never re-triggers workflows.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force the bump level instead of scanning commits
        required: false
        default: ""
        type: choice
        options: ["", patch, minor, major]
      rebuild:
        description: Rebuild and re-attach the app for an existing tag (e.g. v0.3.0) instead of releasing
        required: false
        default: ""
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    if: github.repository == 'mfozmen/notelore'
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      released: ${{ steps.rebuild.outputs.released || steps.release.outputs.released }}
      tag: ${{ steps.rebuild.outputs.tag || steps.release.outputs.tag }}
      version: ${{ steps.rebuild.outputs.version || steps.release.outputs.version }}
    steps:
      # Without the update key pair (#485, docs/development.md) a release would
      # ship apps that never update again: stop before anything is tagged.
      - name: The update signing key is set up
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.NOTELORE_UPDATE_SIGNING_KEY }}
          # Public by nature; inline so an asset swap cannot also swap the anchor.
          UPDATE_KEY: 'EOKo49dj6U5znM+aku0K0uvrHLUe4syXGcX/JXHrlsU='
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_KEY" ]; then echo "::error::the pinned update public key is not set"; exit 1; fi
          if [ -z "$SIGNING_KEY" ]; then echo "::error::the secret NOTELORE_UPDATE_SIGNING_KEY is not set"; exit 1; fi
          key="$RUNNER_TEMP/update-key.pem"
          trap 'rm -f "$key"' EXIT INT TERM
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          if [ "$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64 -w0)" != "$UPDATE_KEY" ]; then
            echo "::error::NOTELORE_UPDATE_SIGNING_KEY is not the private half of NOTELORE_UPDATE_PUBLIC_KEY"
            exit 1
          fi

      # A rebuild skips Semantic Release and hands the existing tag to the app jobs.
      - name: Existing tag to rebuild
        id: rebuild
        if: inputs.rebuild != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.rebuild }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          { echo "released=true"; echo "tag=$TAG"; echo "version=${TAG#v}"; } >> "$GITHUB_OUTPUT"

      # main is protected by a ruleset whose only bypass is a deploy key: the
      # version commit and tag go out over SSH with RELEASE_DEPLOY_KEY. The
      # GitHub Release itself is an API call and uses GITHUB_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: inputs.rebuild == ''
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Python Semantic Release
        id: release
        if: inputs.rebuild == ''
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278  # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Commit and tag locally only: the action runs in a container that
          # cannot use the checkout's SSH setup, so the push is the next step.
          push: "false"
          vcs_release: "false"
          force: ${{ inputs.force }}
          config_file: releaserc.toml

      # The container ran as root on this checkout; take .git back before pushing.
      # --atomic: the commit and the tag land together or not at all.
      - name: Push the version commit and tag
        if: steps.release.outputs.released == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" .git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      # A stale price table gives a confident but wrong cost estimate (#272):
      # older than 60 days, the run says so. It never blocks a release.
      - name: Check the age of the usage price table
        if: steps.release.outputs.released == 'true'
        run: |
          taken=$(grep -oP "pricesTaken = '\K[0-9-]+" packages/notelore_core/lib/src/usage.dart)
          age=$(( ( $(date +%s) - $(date -d "$taken" +%s) ) / 86400 ))
          if [ "$age" -gt 60 ]; then
            echo "::warning::The usage price table is $age days old (pricesTaken $taken): re-check the prices in usage.dart."
          fi

      # A draft until `attach` has every platform's files up (#476): published
      # now, it would be the latest release before the app could update to it.
      # Re-runnable: an existing release for the tag is left as it is.
      - name: Create the GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES: ${{ steps.release.outputs.release_notes }}
        run: gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "$NOTES" --draft

  app-desktop:
    name: App (${{ matrix.target }})
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # The build runs pub's and Gradle's code: it gets no write token. `attach`
    # uploads what it built (#315).
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    env:
      VERSION: ${{ needs.release.outputs.version }}
      # The OAuth client ids go into the binary at build time; they are never in the repo.
      NOTELORE_GOOGLE_CLIENT_ID: ${{ secrets.NOTELORE_GOOGLE_CLIENT_ID }}
      NOTELORE_GOOGLE_CLIENT_SECRET: ${{ secrets.NOTELORE_GOOGLE_CLIENT_SECRET }}
      # Public: the update key the app pins (#485).
      NOTELORE_UPDATE_PUBLIC_KEY: 'EOKo49dj6U5znM+aku0K0uvrHLUe4syXGcX/JXHrlsU='
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Flutter version from the root pubspec, read without yq (windows-latest lacks it, #469)
        id: flutter
        shell: bash
        run: |
          v=$(sed -n 's/^  flutter: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          # No exact pin found: stop, never build on whatever Flutter is newest.
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no exact Flutter pin in pubspec.yaml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          # No restored pub cache: native code from build hooks (llamadart, #328)
          # runs here beside the signing key, so only what the lock pins.
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Build
        working-directory: apps/notelore
        shell: bash
        run: >-
          flutter build ${{ matrix.target }} --release
          --dart-define=NOTELORE_VERSION="$VERSION"
          --dart-define=NOTELORE_GOOGLE_CLIENT_ID="$NOTELORE_GOOGLE_CLIENT_ID"
          --dart-define=NOTELORE_GOOGLE_CLIENT_SECRET="$NOTELORE_GOOGLE_CLIENT_SECRET"
          --dart-define=NOTELORE_UPDATE_PUBLIC_KEY="$NOTELORE_UPDATE_PUBLIC_KEY"
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      # The installer (setup.exe / .dmg).
      - name: Package
        shell: bash
        run: bash tool/package_desktop.sh "$VERSION" dist Release
      # A delta is only safe from a version whose helper is already installed;
      # the first release after this change therefore has none.
      - name: Changed-files delta
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public by nature; inline so an asset swap cannot also swap the anchor.
          UPDATE_KEY: 'EOKo49dj6U5znM+aku0K0uvrHLUe4syXGcX/JXHrlsU='
        run: |
          set -euo pipefail
          releases=$(gh release list --exclude-drafts --limit 2 --json tagName --jq '.[].tagName')
          if [ -z "$releases" ]; then echo "no previous release; no delta"; exit 0; fi
          if [ -z "$UPDATE_KEY" ]; then echo "no update public key; no delta"; exit 0; fi
          for previous in $releases; do
            old_version=${previous#v}
            old_setup="notelore-app-$old_version-windows-x64-setup.exe"
            old_dir="$RUNNER_TEMP/old-$old_version"
            mkdir -p "$old_dir"
            if ! gh release download "$previous" \
              -p "$old_setup" -p "$old_setup.sha256" -p "$old_setup.sha256.sig" \
              -D "$old_dir"; then
              echo "no signed Windows setup for $previous; no delta from it"
              continue
            fi
            if [ ! -f "$old_dir/$old_setup" ] || [ ! -f "$old_dir/$old_setup.sha256" ] ||
              [ ! -f "$old_dir/$old_setup.sha256.sig" ]; then
              echo "old setup $old_version or its signed checksum is missing; no delta from it"
              continue
            fi
            python - "$UPDATE_KEY" "$RUNNER_TEMP/old-update.pub" <<'PY'
          import base64, sys, textwrap
          raw = base64.b64decode(sys.argv[1])
          assert len(raw) == 32
          spki = bytes.fromhex('302a300506032b6570032100') + raw
          body = '\n'.join(textwrap.wrap(base64.b64encode(spki).decode(), 64))
          open(sys.argv[2], 'w').write(
              '-----BEGIN PUBLIC KEY-----\n' + body + '\n-----END PUBLIC KEY-----\n')
          PY
            if ! base64 -d "$old_dir/$old_setup.sha256.sig" > "$RUNNER_TEMP/old-update.sig"; then
              echo "old setup $old_version has a damaged signature; no delta from it"
              continue
            fi
            if ! openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/old-update.pub" \
              -rawin -in "$old_dir/$old_setup.sha256" -sigfile "$RUNNER_TEMP/old-update.sig"; then
              echo "old setup $old_version is not signed by the release key; no delta from it"
              continue
            fi
            expected=$(cat "$old_dir/$old_setup.sha256")
            # From stdin: given a path with a backslash ($RUNNER_TEMP on Windows),
            # sha256sum escapes its line with a leading "\" and never matches.
            # The whole signed line, name included: an older setup uploaded under
            # this name carries a genuine signature for its own name only.
            actual="$(sha256sum < "$old_dir/$old_setup" | cut -d' ' -f1)  $old_setup"
            if [ "$expected" != "$actual" ]; then
              echo "old setup $old_version does not match its signed checksum (expected $expected, got $actual); no delta from it"
              continue
            fi
            old_app="$RUNNER_TEMP/oldapp-$old_version"
            rm -rf "$old_app"
            MSYS_NO_PATHCONV=1 "$old_dir/$old_setup" /CURRENTUSER /VERYSILENT \
              /SUPPRESSMSGBOXES /NORESTART /NOLAUNCH "/DIR=$(cygpath -w "$old_app")"
            for _ in $(seq 60); do [ -f "$old_app/notelore.exe" ] && break; sleep 1; done
            if [ ! -f "$old_app/notelore.exe" ]; then
              echo "old app $old_version did not install; no delta from it"
              continue
            fi
            (cd apps/notelore && dart run tool/make_delta.dart \
              --old="$(cygpath -w "$old_app")" \
              --new="$(cygpath -w "$(pwd)/build/windows/x64/runner/Release")" \
              --version="$VERSION" --from="$old_version" \
              --out="$(cygpath -w "$(pwd)/../../dist")")
          done
      # The universal dmg above stays as the fallback; these two are half the
      # size for the Mac each person actually has.
      - name: Per-architecture macOS dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle="apps/notelore/build/macos/Build/Products/Release/notelore.app"
          for arch in arm64 x86_64; do
            dir="$RUNNER_TEMP/macos-$arch"
            rm -rf "$dir"
            mkdir -p "$dir"
            cp -R "$bundle" "$dir/notelore.app"
            bash tool/thin_macos_app.sh "$dir/notelore.app" "$arch"
            bash tool/package_desktop.sh "$VERSION" dist Release "$dir/notelore.app" "$arch"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: app-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  app-android:
    name: App (android)
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read  # as app-desktop: `attach` uploads
    env:
      VERSION: ${{ needs.release.outputs.version }}
      NOTELORE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NOTELORE_GOOGLE_WEB_CLIENT_ID }}
      KEYSTORE_BASE64: ${{ secrets.NOTELORE_ANDROID_KEYSTORE_BASE64 }}
      NOTELORE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NOTELORE_ANDROID_KEYSTORE_PASSWORD }}
      NOTELORE_ANDROID_KEY_PASSWORD: ${{ secrets.NOTELORE_ANDROID_KEY_PASSWORD }}
      NOTELORE_ANDROID_KEY_ALIAS: ${{ secrets.NOTELORE_ANDROID_KEY_ALIAS }}
      NOTELORE_UPDATE_PUBLIC_KEY: 'EOKo49dj6U5znM+aku0K0uvrHLUe4syXGcX/JXHrlsU='
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Flutter version from the root pubspec, read without yq (windows-latest lacks it, #469)
        id: flutter
        shell: bash
        run: |
          v=$(sed -n 's/^  flutter: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          # No exact pin found: stop, never build on whatever Flutter is newest.
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no exact Flutter pin in pubspec.yaml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          # No restored pub cache: native code from build hooks (llamadart, #328)
          # runs here beside the signing key, so only what the lock pins.
          cache: false
      - run: flutter pub get --enforce-lockfile
      # A debug-signed APK could never be updated by a properly signed one: no key, no release.
      - name: Release key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::NOTELORE_ANDROID_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NOTELORE_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the signed APKs
        working-directory: apps/notelore
        # versionCode from the version: 1.2.3 -> 1002003, always increasing.
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          args=(
            --build-name="$VERSION"
            --build-number=$((major * 1000000 + minor * 1000 + patch))
            --dart-define=NOTELORE_VERSION="$VERSION"
            --dart-define=NOTELORE_GOOGLE_WEB_CLIENT_ID="$NOTELORE_GOOGLE_WEB_CLIENT_ID"
            --dart-define=NOTELORE_UPDATE_PUBLIC_KEY="$NOTELORE_UPDATE_PUBLIC_KEY"
          )
          flutter build apk --release --split-per-abi "${args[@]}"
          mkdir -p "$RUNNER_TEMP/splits"
          cp build/app/outputs/flutter-apk/app-*-release.apk "$RUNNER_TEMP/splits/"
          # The universal APK stays for a device whose ABI the app cannot name.
          flutter build apk --release "${args[@]}"
      - name: Package
        run: |
          universal="notelore-app-$VERSION-android.apk"
          cp apps/notelore/build/app/outputs/flutter-apk/app-release.apk "$universal"
          sha256sum "$universal" > "$universal.sha256"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            asset="notelore-app-$VERSION-android-$abi.apk"
            cp "$RUNNER_TEMP/splits/app-$abi-release.apk" "$asset"
            sha256sum "$asset" > "$asset.sha256"
          done
          ls -l notelore-app-"$VERSION"-android*.apk*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: app-android
          path: |
            notelore-app-${{ needs.release.outputs.version }}-android*.apk
            notelore-app-${{ needs.release.outputs.version }}-android*.apk.sha256
          if-no-files-found: error
          retention-days: 1

  # The only job that writes to the release: no checkout, no build, nothing of
  # the repository runs here. It attaches what the builds uploaded, and runs
  # even when one platform failed, so the files that built are there (#315);
  # it publishes the release only when all did (#476).
  attach:
    name: Attach to the release
    needs: [release, app-desktop, app-android]
    if: ${{ !cancelled() && needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: app-*
          path: dist
          merge-multiple: true
      # Only the files the updater installs, checksummed here and not by the
      # builds, get <file>.sha256.sig (#485); any failure leaves the draft.
      - name: Sign the checksums
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.NOTELORE_UPDATE_SIGNING_KEY }}
          # Public by nature; inline so an asset swap cannot also swap the anchor.
          UPDATE_KEY: 'EOKo49dj6U5znM+aku0K0uvrHLUe4syXGcX/JXHrlsU='
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/update-key.pem"
          public="$RUNNER_TEMP/update-key.pub"
          trap 'rm -f "$key" "$public" "$RUNNER_TEMP/update.sig"' EXIT INT TERM
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          openssl pkey -in "$key" -pubout -out "$public"
          if [ "$(openssl pkey -pubin -in "$public" -outform DER | tail -c 32 | base64 -w0)" != "$UPDATE_KEY" ]; then
            echo "::error::NOTELORE_UPDATE_SIGNING_KEY is not the private half of NOTELORE_UPDATE_PUBLIC_KEY"
            exit 1
          fi
          cd dist
          signed=0
          for file in "notelore-app-$VERSION-windows-x64-setup.exe" "notelore-app-$VERSION-macos.dmg" \
            "notelore-app-$VERSION-macos-arm64.dmg" "notelore-app-$VERSION-macos-x86_64.dmg" \
            "notelore-app-$VERSION-android.apk" \
            "notelore-app-$VERSION-android-arm64-v8a.apk" \
            "notelore-app-$VERSION-android-armeabi-v7a.apk" \
            "notelore-app-$VERSION-android-x86_64.apk"; do
            [ -f "$file" ] || continue # its build failed: the release stays a draft
            sha256sum "$file" > "$file.sha256"
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$file.sha256" -out "$RUNNER_TEMP/update.sig"
            openssl pkeyutl -verify -pubin -inkey "$public" -rawin -in "$file.sha256" \
              -sigfile "$RUNNER_TEMP/update.sig"
            base64 -w0 "$RUNNER_TEMP/update.sig" > "$file.sha256.sig"
            signed=$((signed + 1))
          done
          for manifest in notelore-app-"$VERSION"-windows-x64-delta-*.json; do
            [ -f "$manifest" ] || continue
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$manifest" -out "$RUNNER_TEMP/update.sig"
            openssl pkeyutl -verify -pubin -inkey "$public" -rawin -in "$manifest" \
              -sigfile "$RUNNER_TEMP/update.sig"
            base64 -w0 "$RUNNER_TEMP/update.sig" > "$manifest.sig"
            signed=$((signed + 1))
          done
          if [ "$signed" -eq 0 ]; then echo "::error::no update file to sign"; exit 1; fi
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      # Only when every platform built: a failed build leaves the release a
      # draft, never a release some devices find no file in. A rebuild then
      # publishes it; a rebuild of a release already out leaves it as it is.
      # Latest only when no newer release is out: a draft rebuilt after a
      # newer one shipped never takes "latest" from it.
      - name: Publish
        if: needs.app-desktop.result == 'success' && needs.app-android.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft --repo "$GITHUB_REPOSITORY")
          [ "$draft" = true ] || exit 0
          newest=$(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' \
            --repo "$GITHUB_REPOSITORY" | sort -V | tail -1)
          latest=false
          if [ "$(printf '%s\n%s\n' "$newest" "$TAG" | sort -V | tail -1)" = "$TAG" ]; then
            latest=true
          fi
          gh release edit "$TAG" --draft=false --latest="$latest" --repo "$GITHUB_REPOSITORY"
