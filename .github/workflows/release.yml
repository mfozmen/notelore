name: Release

# Manual only: run `gh workflow run release.yml` when the maintainer wants a
# release. Python Semantic Release then scans the Conventional Commits since
# the last tag and bumps accordingly (feat -> minor, fix/perf -> patch,
# BREAKING CHANGE -> major), writes CHANGELOG.md, tags vX.Y.Z and cuts a
# GitHub Release; the build job attaches a Windows and a macOS executable.
# Adapted from mfozmen/littlepress-ai.
#
# PSR's own "chore(release): x.y.z [skip ci]" commit is pushed with
# GITHUB_TOKEN, which never re-triggers workflows.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force the bump level instead of scanning commits
        required: false
        default: ""
        type: choice
        options: ["", patch, minor, major]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    if: github.repository == 'mfozmen/notelore'
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # main is protected by a ruleset whose only bypass is a deploy key: the
      # version commit and tag go out over SSH with RELEASE_DEPLOY_KEY. The
      # GitHub Release itself is an API call and uses GITHUB_TOKEN.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Commit and tag locally only: the action runs in a container that
          # cannot use the checkout's SSH setup, so the push is the next step.
          push: "false"
          vcs_release: "false"
          force: ${{ inputs.force }}

      # The container ran as root on this checkout; take .git back before pushing.
      # --atomic: the commit and the tag land together or not at all.
      - name: Push the version commit and tag
        if: steps.release.outputs.released == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" .git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      # Re-runnable: an existing release for the tag is left as it is.
      - name: Create the GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES: ${{ steps.release.outputs.release_notes }}
        run: gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "$NOTES"

  build:
    name: Executable (${{ matrix.name }})
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            exe: notelore.exe
          - os: macos-latest
            name: macos-arm64
            exe: notelore
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}  # the bumped version, not the pre-release commit
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked

      - name: Build with PyInstaller
        run: uv run pyinstaller --noconfirm --clean --onefile --name notelore --paths src src/notelore/__main__.py

      - name: Smoke test
        run: dist/${{ matrix.exe }} --version

      - name: Package
        id: pkg
        shell: bash
        run: |
          asset="notelore-${{ needs.release.outputs.version }}-${{ matrix.name }}.zip"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$asset" ./dist/${{ matrix.exe }} > /dev/null
          else
            (cd dist && zip -q "../$asset" ${{ matrix.exe }})
          fi
          # sha256sum format; notelore update refuses a download without it.
          python3 -c "import hashlib, sys; d = open(sys.argv[1], 'rb').read(); print(f'{hashlib.sha256(d).hexdigest()}  {sys.argv[1]}')" "$asset" > "$asset.sha256"
          cat "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          ASSET: ${{ steps.pkg.outputs.asset }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
