name: Flutter

# The Dart workspace (#60): packages/notelore_core (pure Dart) and apps/notelore
# (Flutter: Android, iOS, Windows, macOS). Same rules as the Python side: format
# and analysis clean, tests on all three OSes, 100% line coverage (tool/coverage_gate.dart),
# and every platform build must compile.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only by default; a job that needs more says so itself (#315).
permissions:
  contents: read

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos

  test:
    name: Flutter test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Core tests with coverage
        working-directory: packages/notelore_core
        run: dart run coverage:test_with_coverage
      - name: App tests with coverage
        working-directory: apps/notelore
        run: flutter test --coverage
      - name: Coverage gate (100% lines)
        run: |
          dart test tool/coverage_gate_test.dart
          dart run tool/coverage_gate.dart packages/notelore_core/coverage/lcov.info apps/notelore/coverage/lcov.info

  android:
    name: Flutter Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Build the debug APK
        working-directory: apps/notelore
        run: flutter build apk --debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: notelore-flutter-android-debug
          path: apps/notelore/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  desktop:
    name: Flutter desktop build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Build ${{ matrix.target }}
        working-directory: apps/notelore
        run: flutter build ${{ matrix.target }} --debug
      # The installers are built on every PR too, so a release never meets a broken one.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Package
        shell: bash
        run: bash tool/package_desktop.sh 0.0.0 dist Debug
      - name: The setup installs and uninstalls
        if: runner.os == 'Windows'
        shell: bash
        run: |
          target="$RUNNER_TEMP/notelore-install"
          MSYS_NO_PATHCONV=1 dist/notelore-app-0.0.0-windows-x64-setup.exe             /CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOLAUNCH "/DIR=$(cygpath -w "$target")"
          test -f "$target/notelore.exe"
          # Installed apps lists it as plain "Notelore" (the version has its own column).
          MSYS_NO_PATHCONV=1 reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F3C2A51-6E2B-4D7A-9C1E-5B0A7D3E9F42}_is1' /v DisplayName | grep -E 'DisplayName +REG_SZ +Notelore\s*$'
          MSYS_NO_PATHCONV=1 "$target/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          # The uninstaller finishes in a copy of itself: wait for it, up to 30 s.
          for _ in $(seq 30); do [ -f "$target/notelore.exe" ] || break; sleep 1; done
          test ! -f "$target/notelore.exe"
      - name: By default the setup installs for all users into Program Files
        if: runner.os == 'Windows'
        shell: bash
        run: |
          target="$(cygpath -u "$PROGRAMFILES")/Notelore"
          MSYS_NO_PATHCONV=1 dist/notelore-app-0.0.0-windows-x64-setup.exe             /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOLAUNCH
          test -f "$target/notelore.exe"
          MSYS_NO_PATHCONV=1 "$target/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          for _ in $(seq 30); do [ -f "$target/notelore.exe" ] || break; sleep 1; done
          test ! -f "$target/notelore.exe"
      - name: The dmg holds the app
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/notelore-app-0.0.0-macos.dmg
          test -x "$RUNNER_TEMP/dmg/notelore.app/Contents/MacOS/notelore"
          test -L "$RUNNER_TEMP/dmg/Applications"
          hdiutil detach "$RUNNER_TEMP/dmg"
