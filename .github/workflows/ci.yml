name: CI

# Deterministic gate: lint, types and the test matrix must pass on all three
# OSes. Claude Review (claude-review.yml) is advisory except on a Critical.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: CI helper scripts self-test
        run: |
          python3 .github/scripts/test_review_verdict_gate.py
          python3 .github/scripts/test_review_range.py

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  # Dart coverage for Sonar, built in a job that holds no secrets (#72); the
  # Sonar job only downloads the reports, so no Flutter tooling runs next to SONAR_TOKEN.
  dart-coverage:
    name: Dart coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Coverage with paths Sonar can resolve
        run: |
          (cd packages/notelore_core && dart run coverage:test_with_coverage)
          (cd apps/notelore && flutter test --coverage)
          # lcov paths are relative to each package; Sonar resolves them from the repo root.
          for pkg in packages/notelore_core apps/notelore; do
            sed -i -e "s|^SF:$GITHUB_WORKSPACE/|SF:|" -e "\|^SF:$pkg/|!s|^SF:|SF:$pkg/|" "$pkg/coverage/lcov.info"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dart-lcov
          path: |
            packages/notelore_core/coverage/lcov.info
            apps/notelore/coverage/lcov.info
          if-no-files-found: error

  # SonarCloud analysis + quality gate. Separate job so the deterministic gate
  # above never waits on sonarcloud.io. Needs the SONAR_TOKEN repo secret and
  # Automatic Analysis switched OFF in SonarCloud (it conflicts with CI-based
  # analysis). Skipped on forks: secrets are not available there.
  sonar:
    name: SonarCloud
    needs: dart-coverage
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # blame data for new-code detection
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=xml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dart-lcov
          path: .
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true
