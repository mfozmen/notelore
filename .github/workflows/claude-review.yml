name: Claude Review

# AI code review using anthropics/claude-code-action@v1, adapted from
# mfozmen/conflict.
#
# Auth: the Claude subscription via claude_code_oauth_token, NOT an API key.
# Reviews draw from the subscription quota rather than pay-as-you-go billing.
#
# The review never approves a PR: merge stays a human decision and ci.yml is
# the deterministic gate. It does BLOCK on a Critical finding: the reviewer
# ends its summary with a machine-readable verdict line and the step after it
# turns CRITICAL into a failed check. Warning and Suggestion findings annotate
# without blocking.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  # On-demand re-review by commenting @claude on the PR.
  issue_comment:
    types: [created]

# Cancel an in-flight review for the same PR when a newer push arrives.
# Scoped by event type too, so a comment-triggered run never cancels a
# pull_request review of the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork safety: `pull_request` (never `pull_request_target`) and only when
    # the PR head repo is THIS repo, so the token is never exposed to forks.
    # Comment-triggered runs need @claude from a collaborator or above.
    if: >
      ( github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository ) ||
      ( github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read  # lets claude-code-action's github_ci MCP server read CI status
    steps:
      # A comment-triggered run starts from main; check out the PR head so the
      # reviewer reads the PR's files, not main's.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      # What to review: only the commits since the reviewer's last finished
      # comment (its REVIEWED-HEAD line). Falls back to the whole PR on a first
      # review or after a force-push. Tested: .github/scripts/test_review_range.py.
      - name: Review range
        id: range
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 .github/scripts/review_range.py

      - name: Claude review
        id: review
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea  # v1.0.241
        with:
          # Subscription auth. Do NOT add an Anthropic API key here.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The action writes the agent's output into a tracking comment itself,
          # so a result is visible even if the agent never posts one.
          track_progress: true
          # allowedTools is what lets the reviewer read the checkout and POST its
          # findings. Without Read/Grep/Glob every file inspection is denied and
          # the run ends as a silent no-op.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          prompt: |
            PR number: ${{ github.event.pull_request.number || github.event.issue.number }}

            REVIEW RANGE - mode: ${{ steps.range.outputs.mode }}
              head under review: ${{ steps.range.outputs.head }}
              last reviewed head: ${{ steps.range.outputs.base }}
              this PR's own new commits since then:
            ${{ steps.range.outputs.commits }}

            What the mode means:
            - full: first review, or the earlier head is gone (rebase or
              force-push). Review the whole PR diff with `gh pr diff <number>`.
            - incremental: review ONLY the commits listed above, one
              `git show <sha>` each. The rest of the PR was reviewed at the
              last head; do not review it again. Merges from main are left out
              on purpose.
            - unchanged: no new commits since the last review. Re-check the
              open findings below and nothing else.

            Your previous summary (none on a first review):
            ---
            ${{ steps.range.outputs.previous }}
            ---

            For each finding it left open, say in one line whether the new
            commits closed it or it is still open. A Critical that is still
            open is restated and keeps the verdict CRITICAL. Never raise a new
            finding on lines the reviewed range did not touch, and never repeat
            a Warning or Suggestion the author already saw: this review must
            not turn into a review-fix loop over the same code.

            You are reviewing this pull request for Notelore, a cross-platform
            (Windows, macOS, Linux) Python CLI note-taking assistant. Read
            CLAUDE.md and docs/note-format.md first; they are the standards.

            You must NOT approve the PR: merging stays a human decision and
            ci.yml is the deterministic gate. You DO decide whether this check
            passes: a Critical finding fails it.

            How to publish your review:
            - Fetch the range once (`gh pr diff <number>` in full mode,
              `git show <sha>` per listed commit otherwise); do not re-fetch.
            - Use `mcp__github_inline_comment__create_inline_comment` for the
              handful of most important concrete findings on changed lines.
            - Write the summary into your tracking comment via
              `mcp__github_comment__update_claude_comment`. Always write it,
              even if you find nothing notable. Use `gh pr comment` only as a
              fallback if the tracking-comment tool is unavailable.

            Review the range against CLAUDE.md. The project is moving to
            Flutter (#60): Dart code lives in packages/notelore_core (pure
            Dart, no Flutter imports) and apps/notelore. For Dart, apply the
            same rules: test-first, 100% line coverage, strict analysis, every
            path through one paths module, and the shared note fixtures in
            spec/fixtures/notes as the contract. The Python packages are the
            reference implementation until #69 and should not grow features.

            - Core invariants: Markdown files are the single source of truth;
              notes stay human-readable and the format round-trips byte for
              byte; no tool overwrites a file wholesale or hard-deletes; the
              parser/index answers deterministic questions, not the model.
            - Cross-platform rules: pathlib only; text I/O with
              encoding="utf-8" and newline="\n"; atomic writes with the Windows
              retry; NFC normalization before hashing/comparing; ASCII slugs
              with Turkish transliteration and no Windows-reserved names;
              no shell-specific subprocess calls.
            - Never touch real user data: every path comes from notelore.paths;
              tests use tmp_path via the NOTELORE_HOME fixture.
            - No network in tests; external services are faked.
            - TDD: new production code arrives with tests that mirror the
              source tree; bug fixes start with a regression test.
            - Language: code, comments, docs and commit messages in English.
            - README.md updated for any user-visible change; docs/PLAN.md
              ticked for landed roadmap items.

            Group every finding by severity:
              - **Critical**: correctness bugs, a broken core invariant, data
                loss or a path that can touch real user data, Windows/macOS
                breakage, untested store logic.
              - **Warning**: risky or non-idiomatic code that should be addressed.
              - **Suggestion**: optional improvements and nitpicks.

            Be concise and specific, and always cite the file and line.

            THE LAST TWO LINES of your summary comment are the head you
            reviewed and your verdict, exactly:

                REVIEWED-HEAD: ${{ steps.range.outputs.head }}
                REVIEW-VERDICT: <one of the three below>

            The REVIEWED-HEAD line is how the next review knows where to start;
            copy the sha exactly as given. The verdict is one of these, with
            nothing after it:

                REVIEW-VERDICT: CRITICAL
                REVIEW-VERDICT: WARNING
                REVIEW-VERDICT: CLEAN

            A step reads that line and fails this check on CRITICAL, so use it
            only for what the severity list calls Critical. Style, naming and
            nitpicks are WARNING or CLEAN; blocking a PR on those trains
            everyone to ignore the gate. If unsure, say so and choose WARNING.
            Write the line even when you find nothing: CLEAN is a real verdict.

            Style of comments and naming: a comment the range ADDS or CHANGES
            that narrates what the code does is at most a Warning, listed once
            in a single finding; never flag a comment the range did not touch.

            IMPORTANT: you are already in the repository root. Run every
            command bare (e.g. `gh pr diff 19`), never prefixed with `cd`,
            `&&` or subshells: the tool allowlist matches on the exact command
            start and prefixed commands are denied.

      # Turns the reviewer's verdict into the check's result. A separate step
      # so an execution failure (quota, timeout) stays distinguishable from a
      # real Critical finding. The script reads ONLY the review action's own
      # finished comment, so a verdict typed by any commenter is not a gate.
      - name: Block on a Critical finding
        if: steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 .github/scripts/review_verdict_gate.py
