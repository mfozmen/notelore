name: Mobile

# Android build of apps/mobile with Briefcase (#50). Briefcase downloads its own
# JDK and Android SDK. The debug APK is uploaded as a workflow artifact; release
# APKs come with the Android MVP (#53). iOS joins later from the same project (#54).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Cache the Briefcase JDK and Android SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/briefcase
          key: briefcase-android-${{ runner.os }}-v1

      - name: Create and build the Android app
        working-directory: apps/mobile
        # Pinned: a new Briefcase release must not break unrelated PRs; bump on purpose.
        run: |
          uvx --python 3.12 --from briefcase==0.4.5 briefcase create android --no-input
          uvx --python 3.12 --from briefcase==0.4.5 briefcase build android --no-input

      - name: Upload the debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: notelore-android-debug
          path: apps/mobile/build/notelore-mobile/android/gradle/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android-smoke:
    name: Android smoke test (emulator)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: notelore-android-debug
          path: apk

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Install, start, and wait until the app has run the shared core on the
      # device: every diagnostics line must be OK except the desktop-only ones.
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            adb shell am start -n io.github.mfozmen.notelore_mobile/org.beeware.android.MainActivity
            for i in $(seq 1 60); do adb logcat -d | grep -q "notelore-diagnostics: .. *desktop-only: keyring" && break; sleep 3; done
            adb logcat -d > logcat.txt
            grep -q "notelore-diagnostics: .. *desktop-only: keyring" logcat.txt || echo "::error::the app did not finish its diagnostics within 3 minutes"
            grep -iE "python|beeware|chaquopy|AndroidRuntime|notelore" logcat.txt | tail -120
            grep "notelore-diagnostics" logcat.txt > diagnostics.txt || true
            grep -q "notelore-diagnostics: OK  note round trip" diagnostics.txt
            grep -q "notelore-diagnostics: OK  search index" diagnostics.txt
            grep -q "notelore-diagnostics: OK  YAML" diagnostics.txt
            grep -q "notelore-diagnostics: OK  HTTPS certificates" diagnostics.txt
